[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "studiobench"
version = "0.1.0"
description = "StudioBench: can a foundation model independently deliver a real short video?"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "StudioBench contributors" }]
keywords = ["video-generation", "agent", "benchmark", "evaluation"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
frames = ["Pillow>=9"]
ffmpeg = ["imageio-ffmpeg>=0.4"]
eval = ["Pillow>=9", "numpy>=1.23"]
dev = ["pytest>=7", "Pillow>=9", "imageio-ffmpeg>=0.4"]

[project.urls]
Homepage = "https://github.com/OpenRaiser/StudioBench"
Issues = "https://github.com/OpenRaiser/StudioBench/issues"

[project.scripts]
studiobench = "studiobench.__main__:main"

[tool.setuptools.packages.find]
include = ["studiobench*"]

[tool.setuptools.package-data]
studiobench = ["sp.md"]
